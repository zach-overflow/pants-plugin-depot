tag_prefix = "v"
from_latest_tag = true
ignore_merge_commits = false
ignore_fixup_commits = false
# Every plugin is versioned on its own: tags are `<plugin-name>-vX.Y.Z` and there is no repo-wide version.
# The tags are the only place a version lives: wheels read theirs from git via vcs-versioning at build time.
generate_mono_repository_global_tag = false
branch_whitelist = ["main"]
pre = "alpha.*"
scopes = [
  "actionlint-pants-plugin",
  "builds",
  "ci",
  "deps",
  "dev",
  "goals",
  "hooks",
  "maturin-pants-plugin",
  "oras-pants-plugin",
  "pants-plugin-developer-utils",
  "pyproject-fmt-pants-plugin",
  "pyproject-fmt-plugin",
  "rules",
  "subsystem",
  "targets",
  "ty-pants-plugin",
  "typos-pants-plugin",
  "vcs-versioning-pants-plugin",
  "version",
]
skip_ci = "[skip ci]"
skip_untracked = false
pre_bump_hooks = []
post_bump_hooks = []
pre_package_bump_hooks = []
post_package_bump_hooks = []

[git_hooks]

[commit_types]
feat = { changelog_title = "Features", order = 1 }
fix = { changelog_title = "Bug Fixes", order = 2 }
perf = { changelog_title = "Performance Improvements", order = 3, bump_patch = true }
docs = { changelog_title = "Documentation", order = 4 }
build = { changelog_title = "Internal Tooling / Development", order = 5 }
ci = { changelog_title = "Internal Tooling / Development", order = 5 }
test = { changelog_title = "Internal Tooling / Development", order = 5 }
chore = { changelog_title = "Internal Tooling / Development", order = 5 }
style = { changelog_title = "Internal Tooling / Development", order = 5 }
refactor = { changelog_title = "Internal Tooling / Development", order = 5, bump_patch = true }
revert = { changelog_title = "Revert", omit_from_changelog = true }

[changelog]
path = "CHANGELOG.md"
template = "etc/.cog/changelog-template.tera"
package_template = "etc/.cog/changelog-template.tera"
remote = "github.com"
owner = "zach-overflow"
repository = "pants-plugin-depot"
authors = [{ username = "zach-overflow", signature = "Zach" }]

[bump_profiles]

[monorepo.packages.actionlint-pants-plugin]
path = "provides/actionlint-pants-plugin"

[monorepo.packages.maturin-pants-plugin]
path = "provides/maturin-pants-plugin"

[monorepo.packages.oras-pants-plugin]
path = "provides/oras-pants-plugin"

[monorepo.packages.pants-plugin-developer-utils]
path = "provides/pants-plugin-developer-utils"

[monorepo.packages.pyproject-fmt-pants-plugin]
path = "provides/pyproject-fmt-pants-plugin"

[monorepo.packages.ty-pants-plugin]
path = "provides/ty-pants-plugin"

[monorepo.packages.typos-pants-plugin]
path = "provides/typos-pants-plugin"

[monorepo.packages.vcs-versioning-pants-plugin]
path = "provides/vcs-versioning-pants-plugin"
