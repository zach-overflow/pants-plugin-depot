name: Release
run-name: Release from ${{ github.ref_name }} by ${{ github.actor }}

# One-click release flow (no draft release needed — versioning is driven by conventional commits):
#   1. Run this workflow (Actions -> Release -> Run workflow, from the default branch). It checks the
#      commits since the latest tag are conventional and that at least one plugin warrants a bump, then
#      validates the repo and builds the wheels WITHOUT publishing anything.
#   2. `cog bump --auto` then bumps every plugin whose files changed (cog.toml lists them under
#      `[monorepo.packages]`). Per bumped plugin it rewrites `version` in
#      `provides/<plugin-name>/pyproject.toml`, updates `provides/<plugin-name>/CHANGELOG.md`, and tags
#      `<plugin-name>-vX.Y.Z`. All of it lands in ONE `chore(version): bump packages` commit, which is
#      pushed to the default branch with the tags.
#   3. Per tag, a DRAFT GitHub release is created with that plugin's changelog section as its body, and
#      the Publish workflow is dispatched (see the `publish` job below for why it is dispatched rather than
#      `push`-triggered or called as a reusable workflow). Publish attaches the wheel to the draft and only
#      then publishes it: releases are immutable once published (assets + tag locked), so nothing may
#      alter a release after the fact.
on:
  workflow_dispatch:

permissions:
  contents: read

# Never validate/tag two releases concurrently.
concurrency:
  group: release
  cancel-in-progress: false

# Layer CI-only overrides on top of pants.toml for every Pants invocation below (see pants.ci.toml).
env:
  PANTS_CONFIG_FILES: pants.ci.toml

jobs:
  # cocogitto-action@v4.2.0 pins cog 7.0.0 (the floating v4 tag lags behind and ships an older cog that
  # may not parse this repo's cog.toml).
  check-commits:
    name: Check conventional commits
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "::error::Releases must be run from '${DEFAULT_BRANCH}' (got '${GITHUB_REF_NAME}')."
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # cog needs the full history and tags to find each plugin's latest release tag.
          fetch-depth: 0
      - name: Check commits since the latest tag are conventional
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: check
      # cog exits 0 and prints a sentence instead of tags when no plugin warrants a bump.
      - name: Compute the pending release tags (dry run)
        run: |
          pending="$(cog bump --auto --dry-run)"
          if ! grep -Eq '^[a-z0-9][a-z0-9-]*-v[0-9]+\.[0-9]+\.[0-9]+$' <<< "${pending}"; then
            echo "::error::No plugin has a commit that warrants a release (cog printed '${pending}')."
            exit 1
          fi
          echo "::notice::Validating ${GITHUB_SHA} for release: ${pending//$'\n'/ }"

  validate:
    name: Pants validate + build wheels
    needs: check-commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        # No Pants backend for actionlint, so the shared hook runs it directly (downloads a pinned binary).
        run: |
          bash hooks/actionlint.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Initialize Pants
        uses: pantsbuild/actions/init-pants@v11
        with:
          # Bump to invalidate every Pants cache; re-fetch named caches when dependencies change.
          gha-cache-key: v0
          named-caches-hash: ${{ hashFiles('3rdparty/**/*-lockfile.json') }}
          cache-lmdb-store: 'true'

      - name: Check BUILD files are up to date
        run: |
          pants update-build-files --check ::

      - name: Static checks and tests
        run: |
          pants lint check test ::

      # Validation-only build (the Publish workflow rebuilds from each tag). The bump has not happened yet,
      # so these wheels still carry the previously released versions.
      - name: Build wheels
        run: |
          pants package ::
          ls -l dist/*.whl

      - name: Upload Pants log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pants-log
          path: .pants.d/workdir/pants.log

  # `cog bump --auto` commits the version and changelog changes on top of the validated commit and tags
  # that commit once per bumped plugin. The GitHub releases are created as drafts: releases are immutable
  # once published, so Publish's `publish-release` attaches the wheel first, then publishes it.
  approve-and-tag:
    name: Approve, bump, tag, and draft releases
    needs: [check-commits, validate]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      tags: ${{ steps.push.outputs.tags }}
    steps:
      # A rejected token makes checkout fail with the misleading "could not read Username for
      # 'https://github.com'", so check the token first and say what is wrong with it.
      - name: Check RELEASE_TOKEN
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::The 'release' environment has no RELEASE_TOKEN secret."
            exit 1
          fi
          if ! login="$(gh api user --jq .login)"; then
            echo "::error::GitHub rejected RELEASE_TOKEN. Re-create the token and update the secret."
            exit 1
          fi
          if ! admin="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .permissions.admin)"; then
            echo "::error::RELEASE_TOKEN (user '${login}') cannot access ${GITHUB_REPOSITORY}. Grant the token this \
          repository."
            exit 1
          fi
          if [[ "${admin}" != "true" ]]; then
            echo "::error::RELEASE_TOKEN belongs to '${login}', who is not an admin of ${GITHUB_REPOSITORY}. Only an \
          admin's push bypasses the default branch's protection."
            exit 1
          fi
          echo "::notice::RELEASE_TOKEN authenticates as '${login}' (admin)."
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The default branch requires pull requests, which the built-in GITHUB_TOKEN cannot bypass.
          # RELEASE_TOKEN belongs to a repo admin (admins are exempt), and checkout persists it for the
          # `git push` below.
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Require the validated commit
        run: |
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "::error::'${GITHUB_REF_NAME}' moved past the validated commit ${GITHUB_SHA}. Re-run the release."
            exit 1
          fi
      - name: Bump versions, update changelogs, and tag
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: bump
          args: --auto
      # Atomic: the branch and every tag move together or not at all.
      - name: Push the bump commit and the release tags
        id: push
        run: |
          mapfile -t tags < <(git tag --points-at HEAD)
          if [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" || "${#tags[@]}" -eq 0 ]]; then
            echo "::error::cog created no bump commit or no tag on top of ${GITHUB_SHA}."
            exit 1
          fi
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "${tags[@]}"
          echo "tags=${tags[*]}" >> "$GITHUB_OUTPUT"
      # A tag is `<plugin-name>-vX.Y.Z`, and the plugin's directory under `provides/` carries the same name.
      # Its notes are the newest section of `provides/<plugin-name>/CHANGELOG.md`: from the tag's heading to
      # the next `- - -`.
      - name: Draft the GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.push.outputs.tags }}
        run: |
          read -ra tags <<< "${TAGS}"
          for tag in "${tags[@]}"; do
            package="${tag%-v*}"
            changelog="provides/${package}/CHANGELOG.md"
            awk -v heading="## [${tag}]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^- - -$/ { exit }
              found { print }
            ' "${changelog}" > release-notes.md
            if ! grep -q '[^[:space:]]' release-notes.md; then
              echo "::error::Found no section for ${tag} in ${changelog}."
              exit 1
            fi
            gh release create "${tag}" \
              --title "${package} ${tag##*-v}" \
              --notes-file release-notes.md \
              --verify-tag \
              --draft
            echo "::notice::Tagged $(git rev-parse HEAD) as ${tag} and drafted the GitHub release; \
          Publish attaches the wheel and publishes it."
          done

  # Dispatch (not `workflow_call`) so Publish runs as its own top-level workflow: PyPI trusted publishing
  # rejects reusable workflows, and each plugin's registered publisher is pinned to `publish.yml`. One run
  # is dispatched per tag, after its draft release exists.
  publish:
    name: Dispatch publish workflows
    needs: approve-and-tag
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger publish.yml for each release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.approve-and-tag.outputs.tags }}
        run: |
          read -ra tags <<< "${TAGS}"
          for tag in "${tags[@]}"; do
            gh workflow run publish.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${tag}" \
              -f tag="${tag}"
          done
