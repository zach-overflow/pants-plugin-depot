name: Release
run-name: Release ${{ inputs.package || 'all plugins' }} from ${{ github.ref_name }} by ${{ github.actor }}

# One-click release flow (no draft release needed — versioning is driven by conventional commits):
#   1. Run this workflow (Actions -> Release -> Run workflow, from the default branch). It checks the
#      commits since the latest tag are conventional and that at least one plugin warrants a bump, then
#      validates the repo and builds the wheels WITHOUT publishing anything.
#   2. `cog bump --auto` then bumps every plugin whose files changed (cog.toml lists them under
#      `[monorepo.packages]`). Per bumped plugin it updates `provides/<plugin-name>/CHANGELOG.md` and tags
#      `<plugin-name>-vX.Y.Z`. The changelogs land in ONE `chore(version): bump packages` commit, which is
#      pushed to the default branch with the tags. Nothing in the tree carries a version: the wheels read
#      theirs from the tags via vcs-versioning at build time.
#      The optional `package` input restricts this step to ONE plugin (`cog bump --auto --package`); the
#      other plugins' pending commits stay pending for a later run. PyPI allows one pending Trusted
#      Publisher at a time, so plugins that are not on PyPI yet MUST get their first release one per run.
#   3. Per tag, a DRAFT GitHub release is created with that plugin's changelog section as its body, and
#      the Publish workflow is dispatched (see the `publish` job below for why it is dispatched rather than
#      `push`-triggered or called as a reusable workflow). Publish attaches the wheel to the draft and only
#      then publishes it: releases are immutable once published (assets + tag locked), so nothing may
#      alter a release after the fact.
on:
  workflow_dispatch:
    inputs:
      package:
        description: >-
          Plugin to release (a `[monorepo.packages]` name from cog.toml). Leave empty to release every
          plugin with pending changes.
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Never validate/tag two releases concurrently, scoped or not: every run pushes to the default branch.
concurrency:
  group: release
  cancel-in-progress: false

# Layer CI-only overrides on top of pants.toml for every Pants invocation below (see pants.ci.toml).
env:
  PANTS_CONFIG_FILES: pants.ci.toml

jobs:
  # cocogitto-action@v4.2.0 pins cog 7.0.0 (the floating v4 tag lags behind and ships an older cog that
  # may not parse this repo's cog.toml).
  check-commits:
    name: check-commits
    runs-on: ubuntu-latest
    steps:
      - name: require-default-branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "::error::Releases must be run from '${DEFAULT_BRANCH}' (got '${GITHUB_REF_NAME}')."
            exit 1
          fi
      - name: checkout
        uses: actions/checkout@v4
        with:
          # cog needs the full history and tags to find each plugin's latest release tag.
          fetch-depth: 0
      # `cog bump --package` only accepts the `[monorepo.packages.*]` keys; fail early with the valid list.
      - name: validate-package-input
        env:
          PACKAGE: ${{ inputs.package }}
        run: .github/ci_scripts/release_scripts/validate-package-input.sh
      - name: cog-check
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: check
      # cog exits 0 and prints a sentence instead of tags when no plugin warrants a bump.
      - name: compute-pending-release-tags
        env:
          PACKAGE: ${{ inputs.package }}
        run: .github/ci_scripts/release_scripts/compute-pending-release-tags.sh

  validate:
    name: validate
    needs: check-commits
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # vcs-versioning derives each wheel's version from the plugin's tags and the distance to HEAD; a
          # shallow clone has neither.
          fetch-depth: 0

      - name: actionlint
        # No Pants backend for actionlint, so the shared hook runs it directly (downloads a pinned binary).
        run: |
          bash hooks/actionlint.sh

      - name: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: init-pants
        uses: pantsbuild/actions/init-pants@v11
        with:
          # Bump to invalidate every Pants cache; re-fetch named caches when dependencies change.
          gha-cache-key: v0
          named-caches-hash: ${{ hashFiles('3rdparty/**/*-lockfile.json') }}
          cache-lmdb-store: 'true'

      - name: check-build-files
        run: |
          pants update-build-files --check ::

      - name: lint-check-test
        run: |
          pants lint check test ::

      # Validation-only build (the Publish workflow rebuilds from each tag). The tags do not exist yet, so
      # these wheels carry dev versions (`X.Y.Z.devN+g<sha>`, counted from each plugin's previous tag).
      # The whole repo is validated even when `package` scopes the release to one plugin.
      - name: build-wheels
        run: |
          pants package ::
          ls -l dist/*.whl

      - name: upload-pants-log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pants-log
          path: .pants.d/workdir/pants.log

  # `cog bump --auto` commits the changelog changes on top of the validated commit and tags
  # that commit once per bumped plugin. The GitHub releases are created as drafts: releases are immutable
  # once published, so Publish's `publish-release` attaches the wheel first, then publishes it.
  approve-and-tag:
    name: approve-and-tag
    needs: [check-commits, validate]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      tags: ${{ steps.push.outputs.tags }}
    steps:
      # A rejected token makes checkout fail with the misleading "could not read Username for
      # 'https://github.com'", so check the token first and say what is wrong with it. The check is a
      # script in the repo, so fetch it with the default token before the RELEASE_TOKEN checkout.
      - name: checkout-ci-scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: check-release-token
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: .github/ci_scripts/release_scripts/check-release-token.sh
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The default branch requires pull requests, which the built-in GITHUB_TOKEN cannot bypass.
          # RELEASE_TOKEN belongs to a repo admin (admins are exempt), and checkout persists it for the
          # `git push` below.
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: require-validated-commit
        run: |
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "::error::'${GITHUB_REF_NAME}' moved past the validated commit ${GITHUB_SHA}. Re-run the release."
            exit 1
          fi
      # With `package`, cog bumps that plugin alone: one `chore(version): <plugin-name>-vX.Y.Z` commit, one tag.
      - name: cog-bump
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: bump
          args: ${{ inputs.package != '' && format('--auto --package {0}', inputs.package) || '--auto' }}
      # Atomic: the branch and every tag move together or not at all.
      - name: push-bump-and-tags
        id: push
        env:
          PACKAGE: ${{ inputs.package }}
        run: .github/ci_scripts/release_scripts/push-bump-and-tags.sh
      # A tag is `<plugin-name>-vX.Y.Z`, and the plugin's directory under `provides/` carries the same name.
      # Its notes are the newest section of `provides/<plugin-name>/CHANGELOG.md`: from the tag's heading to
      # the next `- - -`.
      - name: draft-github-releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.push.outputs.tags }}
        run: .github/ci_scripts/release_scripts/draft-github-release.sh

  # Dispatch (not `workflow_call`) so Publish runs as its own top-level workflow: PyPI trusted publishing
  # rejects reusable workflows, and each plugin's registered publisher is pinned to `publish.yml`. One run
  # is dispatched per tag, after its draft release exists.
  publish:
    name: publish
    needs: approve-and-tag
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read # a job-level block replaces the workflow default; checkout needs it
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: dispatch-publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.approve-and-tag.outputs.tags }}
        run: .github/ci_scripts/release_scripts/dispatch-publish.sh
