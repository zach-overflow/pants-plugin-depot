name: Publish
run-name: Publish ${{ inputs.tag }}

# Builds and publishes one plugin from its `<plugin-name>-vMAJOR.MINOR.PATCH` tag: the wheel to PyPI, then,
# for plugins that define one, the plugin as a PEX inside an OCI artifact to GitHub Container Registry (the
# in-repo `oras-pants-plugin` publishes it), and finally the GitHub release. Normally dispatched by the Release
# workflow, once per tag, right after it drafts the GitHub release. It is dispatch-only: Release pushes
# its tags with an admin token, so a `push` trigger would fire a second run per tag, and a `workflow_call`
# hand-off would break PyPI trusted publishing, which rejects reusable workflows.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (<plugin-name>-vMAJOR.MINOR.PATCH); it must already exist.'
        required: true
        type: string

permissions:
  contents: read

# Never let two publishes of the same tag run concurrently.
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

# Layer CI-only overrides on top of pants.toml for every Pants invocation below (see pants.ci.toml).
env:
  PANTS_CONFIG_FILES: pants.ci.toml

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: validate-release-tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: .github/ci_scripts/publish_scripts/validate-release-tag.sh

  build-wheel:
    name: build-wheel
    needs: setup
    runs-on: ubuntu-latest
    steps:
      # The tag sits on HEAD, so vcs-versioning resolves exactly `<version>` (no dev or local suffix). It
      # needs the full history and every tag to run `git describe`.
      - name: checkout-release-tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: init-pants
        uses: pantsbuild/actions/init-pants@v11
        with:
          gha-cache-key: v0
          named-caches-hash: ${{ hashFiles('3rdparty/**/*-lockfile.json') }}
          cache-lmdb-store: 'true'

      # The plugin's directory under `provides/` carries the tag's plugin name. A missing wheel means
      # vcs-versioning did not see the tag on HEAD (shallow or dirty checkout).
      - name: build-wheel
        env:
          PACKAGE: ${{ needs.setup.outputs.package }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: .github/ci_scripts/publish_scripts/build-wheel.sh

      - name: upload-wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*-${{ needs.setup.outputs.version }}-py3-none-any.whl
          if-no-files-found: error

      - name: upload-pants-log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pants-log
          path: .pants.d/workdir/pants.log

  publish-pypi:
    name: publish-pypi
    needs: build-wheel
    runs-on: ubuntu-latest
    # The `pypi` environment every plugin's PyPI trusted publisher is registered against (gates publishing
    # here only).
    environment: pypi
    permissions:
      contents: read
      id-token: write # mint the OIDC token PyPI exchanges for a short-lived, project-scoped API token
    steps:
      - name: download-wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist

      - name: publish-to-pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Don't fail a re-run if the upload already succeeded (e.g. `publish-release` flaked).
          skip-existing: true

  # Publishes `provides/<plugin-name>:plugin-oci-artifact` (see `_plugin_oci_pex` in
  # `etc/pants-macros/_internal_pants_macros.py`) to `ghcr.io/<owner>/<repo>/<plugin-name>:<version>` and
  # `:latest`, dogfooding `oras-pants-plugin`. Only plugins built with `plugin_wheel(include_oci_pex=True)`
  # define that target; for the others the publish step is a no-op, so `publish-release` still runs. It runs
  # after the PyPI publish, so the `pypi` environment's approval gates it too. Pushing the same tag again is
  # harmless: the artifact is content-addressed.
  publish-ghcr:
    name: publish-ghcr
    needs: [setup, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # `oras cp` pushes to ghcr.io with the workflow token
    steps:
      # Same checkout as build-wheel: vcs-versioning tags the artifact from the tag on HEAD.
      - name: checkout-release-tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: init-pants
        uses: pantsbuild/actions/init-pants@v11
        with:
          gha-cache-key: v0
          named-caches-hash: ${{ hashFiles('3rdparty/**/*-lockfile.json') }}
          cache-lmdb-store: 'true'

      # `oras` reads the credentials `docker login` stores in `~/.docker/config.json`.
      - name: login-ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `pants publish` builds the wheel, the PEX and the OCI image layout, then copies the layout to
      # ghcr.io. `[oras].allow_publish` is false in pants.toml and true in pants.ci.toml, so only CI pushes.
      # The script exits 0 without publishing when the plugin defines no `:plugin-oci-artifact` target.
      - name: publish-oci-artifact
        env:
          PACKAGE: ${{ needs.setup.outputs.package }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: .github/ci_scripts/publish_scripts/publish-oci-artifact.sh

      - name: upload-pants-log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pants-log-publish-ghcr
          path: .pants.d/workdir/pants.log

  # Attach the wheel to the DRAFT release that Release's `approve-and-tag` created, then publish it.
  # Releases are immutable once published (assets + tag locked), so the asset must land while it is still
  # a draft; against an already-published release this job only verifies the wheel is attached. It waits
  # for the OCI artifact too (when the plugin has one), so a published release means every artifact of the
  # version is out.
  publish-release:
    name: publish-release
    needs: [publish-pypi, publish-ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: write # `gh release upload` attaches the asset to the draft; `gh release edit` publishes it
    steps:
      # Before download-wheel: checkout cleans the workspace, which would discard the wheel.
      - name: checkout
        uses: actions/checkout@v7

      - name: download-wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist

      - name: attach-wheel-and-publish-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: .github/ci_scripts/publish_scripts/attach-wheel-and-publish-release.sh
