name: Publish
run-name: Publish ${{ inputs.tag }}

# Builds and publishes one plugin's wheel from its `<plugin-name>-vMAJOR.MINOR.PATCH` tag. Normally
# dispatched by the Release workflow, once per tag, right after it drafts the GitHub release. It is
# dispatch-only: Release pushes its tags with an admin token, so a `push` trigger would fire a second run
# per tag, and a `workflow_call` hand-off would break PyPI trusted publishing, which rejects reusable
# workflows.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (<plugin-name>-vMAJOR.MINOR.PATCH); it must already exist.'
        required: true
        type: string

permissions:
  contents: read

# Never let two publishes of the same tag run concurrently.
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

# Layer CI-only overrides on top of pants.toml for every Pants invocation below (see pants.ci.toml).
env:
  PANTS_CONFIG_FILES: pants.ci.toml

jobs:
  setup:
    name: Resolve the plugin and version
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate the release tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${TAG}" =~ ^([a-z0-9][a-z0-9-]*)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::'${TAG}' is not a <plugin-name>-vMAJOR.MINOR.PATCH release tag - nothing to \
          publish. Release tags must be created via the Release workflow."
            exit 1
          fi
          echo "package=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

  build-wheel:
    name: Build wheel
    needs: setup
    runs-on: ubuntu-latest
    steps:
      # The tagged commit is the bump commit, so `provides/<plugin-name>/pyproject.toml` carries the tag's
      # version.
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Initialize Pants
        uses: pantsbuild/actions/init-pants@v11
        with:
          gha-cache-key: v0
          named-caches-hash: ${{ hashFiles('3rdparty/**/*-lockfile.json') }}
          cache-lmdb-store: 'true'

      # The plugin's directory under `provides/` carries the tag's plugin name. A missing wheel means the
      # committed version and the tag disagree.
      - name: Build wheel
        env:
          PACKAGE: ${{ needs.setup.outputs.package }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          pants package "provides/${PACKAGE}:plugin-whl"
          wheels=(dist/*-"${VERSION}"-py3-none-any.whl)
          if [[ "${#wheels[@]}" -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "::error::Expected exactly one wheel with version ${VERSION} from provides/${PACKAGE}:plugin-whl."
            ls -l dist
            exit 1
          fi
          ls -l "${wheels[0]}"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*-${{ needs.setup.outputs.version }}-py3-none-any.whl
          if-no-files-found: error

      - name: Upload Pants log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pants-log
          path: .pants.d/workdir/pants.log

  publish-pypi:
    name: Publish to PyPI
    needs: build-wheel
    runs-on: ubuntu-latest
    # The `pypi` environment every plugin's PyPI trusted publisher is registered against (gates publishing
    # here only).
    environment: pypi
    permissions:
      contents: read
      id-token: write # mint the OIDC token PyPI exchanges for a short-lived, project-scoped API token
    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Don't fail a re-run if the upload already succeeded (e.g. `publish-release` flaked).
          skip-existing: true

  # Attach the wheel to the DRAFT release that Release's `approve-and-tag` created, then publish it.
  # Releases are immutable once published (assets + tag locked), so the asset must land while it is still
  # a draft; against an already-published release this job only verifies the wheel is attached.
  publish-release:
    name: Attach the wheel and publish the GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # `gh release upload` attaches the asset to the draft; `gh release edit` publishes it
    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - name: Attach the wheel to the draft release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          wheels=(dist/*.whl)
          if [[ "${#wheels[@]}" -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "::error::Expected exactly one wheel in the artifact."
            exit 1
          fi
          wheel_name="$(basename "${wheels[0]}")"
          if ! release="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,assets)"; then
            echo "::error::No GitHub release exists for tag ${TAG}. Release tags must be created via the \
          Release workflow, whose approve-and-tag job drafts the release before dispatching Publish."
            exit 1
          fi
          if [[ "$(jq -r '.isDraft' <<< "${release}")" == "false" ]]; then
            if ! jq -e --arg name "${wheel_name}" '.assets | any(.name == $name)' <<< "${release}" > /dev/null; then
              echo "::error::Release ${TAG} is already published and immutable but lacks ${wheel_name}. \
          Assets cannot be added after publication; cut a new release."
              exit 1
            fi
            echo "::notice::Release ${TAG} is already published with ${wheel_name}; nothing to do."
            exit 0
          fi
          gh release upload "${TAG}" "dist/${wheel_name}" --repo "${GITHUB_REPOSITORY}" --clobber
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          echo "::notice::Published release ${TAG} with ${wheel_name} attached."
