# Repo-wide tool configuration. Each plugin's packaging metadata lives in `provides/<plugin-name>/pyproject.toml`.

[tool.ruff]
target-version = "py314"
line-length = 120
indent-width = 4
src = [ "provides/*/src", "provides/*/tests" ]
format.skip-magic-trailing-comma = true
format.docstring-code-format = true
lint.select = [ "B", "E", "F", "I", "SIM", "UP" ]
lint.extend-select = [
  "C416",
  "D101",
  "D107",
  "D209",
  "D213",
  "D417",
  "D419",
  "ERA001",
  "LOG",
  "PIE790",
  "PLW0603",
  "PT",
  "PYI045",
  "PYI055",
  "RUF006",
  "RUF008",
  "RUF009",
  "RUF010",
  "RUF012",
  "RUF015",
  "RUF018",
  "RUF022",
  "RUF024",
  "RUF032",
  "RUF033",
  "RUF049",
  "RUF100",
  "RUF101",
  "RUF200",
  "TID25",
  "TRY002",
  "W291",
]
# Ignore rules that conflict with the ruff formatter (https://stackoverflow.com/a/77796620).
lint.ignore = [
  "COM812",
  "COM819",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "E203",
  "E501",
  "PT003",
  "PT019",
  "PT022",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "W191",
]
lint.per-file-ignores."provides/*/tests/**/*.py" = [ "D101", "D107" ]
lint.flake8-tidy-imports.ban-relative-imports = "all"
lint.flake8-tidy-imports.banned-api."functools.cache".msg = """\
  functools.cache can corrupt Pants' build cache and should not be used.\
  """
lint.flake8-tidy-imports.banned-api."functools.cached_property".msg = """\
  functools.cached_property can corrupt Pants' build cache and should not be used.\
  """
lint.flake8-tidy-imports.banned-api."functools.lru_cache".msg = """\
  functools.lru_cache can corrupt Pants' build cache and should not be used.\
  """
lint.flake8-tidy-imports.banned-api."os.close".msg = """\
  The os module's file I/O operations are not safe to use in Pants plugins. Use Pants' file I/O library as described \
  here: https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/file-system\
  """
lint.flake8-tidy-imports.banned-api."os.fdopen".msg = """\
  The os module's file I/O operations are not safe to use in Pants plugins. Use Pants' file I/O library as described \
  here: https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/file-system\
  """
lint.flake8-tidy-imports.banned-api."os.fork".msg = """\
  The os module's fork operations are not safe to use in Pants plugins. Use Pants' process library as described here: \
  https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/processes\
  """
lint.flake8-tidy-imports.banned-api."os.open".msg = """\
  The os module's file I/O operations are not safe to use in Pants plugins. Use Pants' file I/O library as described \
  here: https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/file-system\
  """
lint.flake8-tidy-imports.banned-api."typing.NamedTuple".msg = """\
  NamedTuples are incompatible with the Pants engine. Use a frozen Dataclass instead: \
  https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/concepts\
  """
lint.flake8-tidy-imports.banned-api.anyio.msg = "Anyio module is not safe to use in Pants plugins"
lint.flake8-tidy-imports.banned-api.asyncio.msg = "Asyncio module is not safe to use in Pants plugins"
lint.flake8-tidy-imports.banned-api.concurrent.msg = """\
  The concurrent module is not safe to use with Pants plugins.  Use Pants' process library as described here: \
  https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/processes\
  """
lint.flake8-tidy-imports.banned-api.diskcache.msg = """\
  The diskcache module is not threadsafe, and therefore is not safe for Pants plugins\
  """
lint.flake8-tidy-imports.banned-api.filelock.msg = "The filelock module is not safe to use with Pants plugins."
lint.flake8-tidy-imports.banned-api.multiprocessing.msg = """\
  The multiprocessing module is not safe to use in Pants plugins.  Use Pants' process library as described here: \
  https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/processes\
  """
lint.flake8-tidy-imports.banned-api.random.msg = "All pants plugin rules should be pure and consistent."
lint.flake8-tidy-imports.banned-api.shutil.msg = """\
  The shutil module is unsafe for Pants plugins. Use Pants' process library instead: \
  https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/processes\
  """
lint.flake8-tidy-imports.banned-api.subprocess.msg = """\
  The subprocess module is unsafe for Pants plugins. Use Pants' process library instead: \
  https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/processes\
  """
lint.flake8-tidy-imports.banned-api.tempfile.msg = """\
  The tempfile module is unsafe for Pants plugins. Use Pants' file library instead: \
  https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/file-system\
  """
lint.flake8-tidy-imports.banned-api.threading.msg = "The threading module is not safe for Pants plugins."
lint.isort.known-first-party = [
  "maturin_pants_plugin",
  "maturin_pants_plugin_tests",
  "pants_plugin_developer_utils",
  "pants_plugin_developer_utils_tests",
  "pyproject_fmt_pants_plugin",
  "pyproject_fmt_pants_plugin_tests",
  "setuptools_scm_pants_plugin",
  "setuptools_scm_pants_plugin_tests",
  "tach_pants_plugin",
  "tach_pants_plugin_tests",
  "ty_pants_plugin",
  "ty_pants_plugin_tests",
]
lint.isort.section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
lint.isort.split-on-trailing-comma = false
lint.pycodestyle.ignore-overlong-task-comments = true
lint.pydocstyle.convention = "google"
lint.pydocstyle.ignore-var-parameters = true

[tool.mypy]
mypy_path = [ "$MYPY_CONFIG_FILE_DIR/provides" ]
namespace_packages = true
explicit_package_bases = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
pretty = true
no_implicit_optional = true
show_error_codes = true

[tool.pytest]
ini_options.minversion = "8.4"
ini_options.addopts = [
  "--force-short-summary",
  "--tb=line",
  "-p",
  "no:cacheprovider",
  "--strict-markers",
]
