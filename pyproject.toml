# Repo-wide tool configuration. Each plugin's packaging metadata lives in `provides/<plugin-name>/pyproject.toml`.

[tool.ruff]
target-version = "py314"
line-length = 120
indent-width = 4
src = [ "provides/*/src", "provides/*/tests" ]
format.skip-magic-trailing-comma = true
format.docstring-code-format = true
lint.select = [ "B", "E", "F", "I", "S", "SIM", "UP" ]
lint.extend-select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "BLE",
  "C4",
  "C901",
  "COM818",
  "D2",
  "D3",
  "D4",
  "D101",
  "D107",
  "DOC",
  "DTZ",
  "EM",
  "ERA001",
  "EXE",
  "FA",
  "FBT",
  "FIX",
  "FLY",
  "FURB",
  "G",
  "ICN",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q004",
  "RET",
  "RSE",
  "RUF",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC006",
  "TD",
  "TID25",
  "TRY",
  "W",
  "YTT",
]
# Ignore rules that conflict with the ruff formatter (https://stackoverflow.com/a/77796620).
lint.ignore = [
  # Explicit `Any` annotations are allowed.
  "ANN401",
  # Flags the pure `os.path.normpath`.
  "ASYNC240",
  "COM812",
  "COM819",
  "D206",
  # Conflicts with `D213`.
  "D212",
  "D300",
  # Summary-only docstrings don't need a `Returns` section.
  "DOC201",
  "E111",
  "E114",
  "E117",
  "E203",
  "E501",
  # Pants lints each batch of test files in a sandbox without the package's `__init__.py`.
  "INP001",
  # Pants rules take many injected subsystems as parameters.
  "PLR0913",
  "PLR0917",
  "PT003",
  "PT019",
  "PT022",
  # Pants paths are strings, so `os.path.join` and friends stay.
  "PTH118",
  "PTH119",
  "PTH120",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  # Pants `@rule` functions are `async def` by convention, even without awaits.
  "RUF029",
  # Rule codes stay in suppression comments and selectors.
  "RUF106",
  "RUF201",
  "W191",
]
lint.per-file-ignores."provides/*/tests/**/*.py" = [
  # Don't require docstrings in tests
  "D101",
  "D107",
  # Magic values in test assertions are fine.
  "PLR2004",
  # Don't raise bandit errors on `assert` statements in tests.
  "S101",
]
# Like mypy, accept `__init__` without `-> None` when a parameter is annotated.
lint.flake8-annotations.mypy-init-return = true
lint.flake8-tidy-imports.ban-relative-imports = "all"
lint.isort.known-first-party = [
  "actionlint_pants_plugin",
  "actionlint_pants_plugin_tests",
  "maturin_pants_plugin",
  "maturin_pants_plugin_tests",
  "oras_pants_plugin",
  "oras_pants_plugin_tests",
  "pants_plugin_developer_utils",
  "pants_plugin_developer_utils_tests",
  "pyproject_fmt_pants_plugin",
  "pyproject_fmt_pants_plugin_tests",
  "tach_pants_plugin",
  "tach_pants_plugin_tests",
  "ty_pants_plugin",
  "ty_pants_plugin_tests",
  "typos_pants_plugin",
  "typos_pants_plugin_tests",
  "vcs_versioning_pants_plugin",
  "vcs_versioning_pants_plugin_tests",
]
lint.isort.section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
lint.isort.split-on-trailing-comma = false
lint.pycodestyle.ignore-overlong-task-comments = true
lint.pydocstyle.convention = "google"
lint.pydocstyle.ignore-var-parameters = true
# Part of ty's strict recipe, together with `ANN` and `PYI`.
lint.preview = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"functools.cache".msg = "functools.cache can corrupt Pants' build cache and should not be used."
"functools.cached_property".msg = "functools.cached_property can corrupt Pants' build cache and should not be used."
"functools.lru_cache".msg = "functools.lru_cache can corrupt Pants' build cache and should not be used."
"os.close".msg = "The os module's file I/O operations are not safe to use in Pants plugins. Use Pants' file I/O library as described here: https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/file-system"
"os.fdopen".msg = "The os module's file I/O operations are not safe to use in Pants plugins. Use Pants' file I/O library as described here: https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/file-system"
"os.fork".msg = "The os module's fork operations are not safe to use in Pants plugins. Use Pants' process library as described here: https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/processes"
"os.open".msg = "The os module's file I/O operations are not safe to use in Pants plugins. Use Pants' file I/O library as described here: https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/file-system"
"typing.NamedTuple".msg = "NamedTuples are incompatible with the Pants engine. Use a frozen Dataclass instead: https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/concepts"
anyio.msg = "Anyio module is not safe to use in Pants plugins"
asyncio.msg = "Asyncio module is not safe to use in Pants plugins"
concurrent.msg = "The concurrent module is not safe to use with Pants plugins.  Use Pants' process library as described here: https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/processes"
diskcache.msg = "The diskcache module is not threadsafe, and therefore is not safe for Pants plugins"
filelock.msg = "The filelock module is not safe to use with Pants plugins."
multiprocessing.msg = "The multiprocessing module is not safe to use in Pants plugins.  Use Pants' process library as described here: https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/processes"
random.msg = "All pants plugin rules should be pure and consistent."
shutil.msg = "The shutil module is unsafe for Pants plugins. Use Pants' process library instead: https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/processes"
subprocess.msg = "The subprocess module is unsafe for Pants plugins. Use Pants' process library instead: https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/processes"
tempfile.msg = "The tempfile module is unsafe for Pants plugins. Use Pants' file library instead: https://www.pantsbuild.org/stable/docs/writing-plugins/the-rules-api/file-system"
threading.msg = "The threading module is not safe for Pants plugins."

[tool.pyproject-fmt]
# Keep each `banned-api` message on one line: pyproject-fmt's string wrapping is what `ruff` shows users.
expand_tables = [ "tool.ruff.lint.flake8-tidy-imports.banned-api" ]
skip_wrap_for_keys = [ "tool.ruff.lint.flake8-tidy-imports.banned-api.*" ]

# `ty` runs through the in-repo `ty-pants-plugin`; Pants supplies the search paths and Python version.
# Missing annotations are Ruff's job (`ANN`): `ty` has no rule for them. The rules mirror mypy's strict
# flags where `ty` has an equivalent, following ty's strict recipe:
# https://docs.astral.sh/ty/coming-from-mypy-or-pyright/#stricter-checking-with-ty
[tool.ty]
# mypy `disallow_untyped_decorators`
rules.dynamic-function-decorator-return = "error"
# mypy `disallow_any_generics`
rules.missing-type-argument = "error"
# No mypy strict flag; part of ty's strict recipe.
rules.possibly-unresolved-reference = "warn"
# mypy `warn_redundant_casts`
rules.redundant-cast = "error"
# mypy `strict_equality`
rules.redundant-condition = "error"
# mypy `warn_return_any`
rules.unsound-return-statement = "error"
# mypy `warn_unused_ignores`
rules.unused-ignore-comment = "error"
rules.unused-type-ignore-comment = "error"

# VS Code opens `BUILD` files as Python (`files.associations`), so the ty language server checks them.
# Target and macro calls (`python_sources()`, `plugin_wheel()`) are injected by Pants, not importable, and
# whatever a macro derives from them is `Unknown` to ty.
[[tool.ty.overrides]]
include = [ "**/BUILD", "**/BUILD.*", "etc/pants-macros/*.py" ]

[tool.ty.overrides.rules]
unresolved-reference = "ignore"
unsound-return-statement = "ignore"

[tool.pytest]
ini_options.minversion = "8.4"
ini_options.addopts = [
  "--force-short-summary",
  "--tb=line",
  "-p",
  "no:cacheprovider",
  "--strict-markers",
]
