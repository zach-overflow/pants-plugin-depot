# Repo-wide tool configuration. Each plugin's packaging metadata lives in `provides/<plugin-name>/pyproject.toml`.

[tool.ruff]
target-version = "py314"
src = ["provides/*/src", "provides/*/tests"]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
extend-select = [
  "C416",
  "D101",
  "D107",
  "D209",
  "D213",
  "D417",
  "D419",
  "ERA001",
  "LOG",
  "PIE790",
  "PLW0603",
  "PT",
  "PYI045",
  "PYI055",
  "RUF006",
  "RUF008",
  "RUF009",
  "RUF010",
  "RUF012",
  "RUF015",
  "RUF018",
  "RUF022",
  "RUF024",
  "RUF032",
  "RUF033",
  "RUF049",
  "RUF100",
  "RUF101",
  "RUF200",
  "TID25",
  "TRY002",
  "W291",
]
# Ignore rules that conflict with the ruff formatter (https://stackoverflow.com/a/77796620).
ignore = [
  "COM812",
  "COM819",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "E203",
  "E501",
  "PT003",
  "PT019",
  "PT022",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "W191",
]

[tool.ruff.lint.per-file-ignores]
"provides/*/tests/**/*.py" = ["D101", "D107"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
known-first-party = [
  "pyproject_fmt_pants_plugin",
  "pyproject_fmt_pants_plugin_tests",
]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
skip-magic-trailing-comma = true
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.4"
addopts = [
  "--force-short-summary",
  "--tb=line",
  "-p",
  "no:cacheprovider",
  "--strict-markers",
]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
