[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyproject-fmt-pants-plugin"
dynamic = ["version"]
# Pants loads plugins into its own interpreter (CPython 3.14 as of Pants 2.32).
requires-python = ">=3.14"
# `pantsbuild.pants` is deliberately absent: Pants supplies itself at plugin load time and is not on PyPI.
dependencies = []
authors = [{ name = "Zach Gottesman" }]
maintainers = [{ name = "zach-overflow" }]
keywords = [
  "formatter",
  "pants",
  "pants plugin",
  "pantsbuild",
  "pyproject-fmt",
  "pyproject.toml",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "A Pantsbuild plugin for formatting pyproject.toml files with pyproject-fmt."
readme = "README.md"

[project.urls]
Repository = "https://github.com/zach-overflow/pyproject-fmt-pantsbuild-plugin"
"Bug Tracker" = "https://github.com/zach-overflow/pyproject-fmt-pantsbuild-plugin/issues"
Changelog = "https://github.com/zach-overflow/pyproject-fmt-pantsbuild-plugin/releases"

[tool.setuptools.dynamic]
version = { attr = "pyproject_fmt_pants_plugin._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyproject_fmt_pants_plugin*"]

[tool.setuptools.package-data]
pyproject_fmt_pants_plugin = ["py.typed"]

[tool.ruff]
target-version = "py314"
src = ["src", "."]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
extend-select = [
  "C416",
  "D101",
  "D107",
  "D209",
  "D213",
  "D417",
  "D419",
  "ERA001",
  "LOG",
  "PIE790",
  "PLW0603",
  "PT",
  "PYI045",
  "PYI055",
  "RUF006",
  "RUF008",
  "RUF009",
  "RUF010",
  "RUF012",
  "RUF015",
  "RUF018",
  "RUF022",
  "RUF024",
  "RUF032",
  "RUF033",
  "RUF049",
  "RUF100",
  "RUF101",
  "RUF200",
  "TID25",
  "TRY002",
  "W291",
]
# Ignore rules that conflict with the ruff formatter (https://stackoverflow.com/a/77796620).
ignore = [
  "COM812",
  "COM819",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "E203",
  "E501",
  "PT003",
  "PT019",
  "PT022",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "W191",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D101", "D107"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
known-first-party = ["pyproject_fmt_pants_plugin", "tests"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
skip-magic-trailing-comma = true
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.4"
addopts = [
  "--force-short-summary",
  "--tb=line",
  "-p",
  "no:cacheprovider",
  "--strict-markers",
]

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
namespace_packages = true
