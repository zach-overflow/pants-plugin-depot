[GLOBAL]
backend_packages = [
  "pants.backend.build_files.fmt.ruff",
  "pants.backend.experimental.python.lint.ruff.check",
  "pants.backend.experimental.python.lint.ruff.format",
  "pants.backend.experimental.tools.yamllint",
  "pants.backend.plugin_development",
  "pants.backend.python",
  "pants.backend.python.typecheck.mypy",
  "pants.backend.shell",
  "pants.backend.shell.lint.shellcheck",
  "pants.backend.shell.lint.shfmt",
  "pants.backend.tools.taplo",
  "pyproject_fmt_pants_plugin",
  "vcs_versioning_pants_plugin",
]
pants_version = "2.33.1"
# https://www.pantsbuild.org/stable/docs/writing-plugins/overview#in-repo-plugins
pythonpath = [
  "%(buildroot)s/provides/pyproject-fmt-plugin/src",
  "%(buildroot)s/provides/vcs-versioning-pants-plugin/src",
]
build_patterns = ["BUILD", "BUILD.*"]
colors = true
pants_ignore = [".*/", "/dist/", "__pycache__", "!.github/"]

[changed]
dependents = "transitive"

[source]
# Each plugin lives in `provides/<plugin-name>/` with its own `src/` and `tests/` roots.
root_patterns = ["/provides/*/src", "/provides/*/tests"]

[tailor]
build_file_name = "BUILD"

[pyproject-fmt]
config_discovery = true

[taplo]
glob_pattern = [
  "**/*.toml",
  "!.taplo.toml",
  "!taplo.toml",
  # `pyproject-fmt` handles `pyproject.toml` files.
  "!**/pyproject.toml",
]

[cli.alias]
--all-changed = "--changed-since=HEAD --changed-dependents=transitive"

[python-bootstrap]
search_path = ["<PYENV>", "<ASDF>", "<PATH>"]

[python]
resolver = "pex"
enable_resolves = true
default_resolve = "plugin-resolve"
# Pants 2.33 itself runs on CPython 3.14, so plugin code must too.
interpreter_constraints = ["CPython>=3.14,<3.15"]
interpreter_versions_universe = ["3.14", "3.15"]
default_to_resolve_interpreter_constraints = true
pip_version = "latest"
separate_lockfile_metadata_file = true

[python.resolves]
maturin = "provides/maturin-pants-plugin/src/maturin_pants_plugin/lockfile_resource/maturin_lockfile.json"
"plugin-resolve" = "3rdparty/python/plugin-lockfile.json"
"vcs-versioning" = "provides/vcs-versioning-pants-plugin/src/vcs_versioning_pants_plugin/lockfile_resource/vcs_versioning_lockfile.json"

[python-infer]
# Plugins share one resolve but each declares its own requirements. When two plugins declare the same
# requirement, an import resolves to the target in the importing plugin's own directory.
ambiguity_resolution = "by_source_root"

[mypy]
config = "pyproject.toml"

[pytest]
args = ["-vv"]
config = "pyproject.toml"

[ruff]
version = "0.16.8"
known_versions = [
  "0.16.8|linux_arm64 |57a4e072b6b74a4dd0036b7b253e056bdb70e02c68504ca6f2bfca2707d03fb6|9565440",
  "0.16.8|linux_x86_64|e56aa612121de356f37d05f3284cd806081fb72d5dbd4814b3810c5a23c562cc|10274044",
  "0.16.8|macos_arm64 |0ffa53899f2970d24f14fbed8d8265c87180b159b7100794d97a1527dc60fa79|9329431",
  "0.16.8|macos_x86_64|bccb4d49c5c9f7e69fd42df2475730a08a641af31b8e0ee5e775e3dd829c4686|9789310",
]

[update-build-files]
fmt = true
formatter = "ruff"

[yamllint]
config_file_name = ".yamllint.yaml"
