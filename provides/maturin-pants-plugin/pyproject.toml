[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=84.0.0" ]

[project]
name = "maturin-pants-plugin"
description = "A Pantsbuild plugin for building and publishing Rust-backed Python wheels with maturin."
readme = "README.md"
keywords = [
  "maturin",
  "pants",
  "pants plugin",
  "pantsbuild",
  "pyo3",
  "rust",
  "wheel",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "zach-overflow" } ]
authors = [ { name = "Zach Gottesman" } ]
# Pants loads plugins into its own interpreter (CPython 3.14 as of Pants 2.33).
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]
dynamic = [ "version" ]
# `pantsbuild.pants` is deliberately absent: Pants supplies itself at plugin load time and is not on PyPI.
dependencies = [ "pants-plugin-developer-utils>=0.1.0" ]
urls."Bug Tracker" = "https://github.com/zach-overflow/pants-plugin-depot/issues"
urls.Changelog = """\
  https://github.com/zach-overflow/pants-plugin-depot/blob/main/provides/maturin-pants-plugin/CHANGELOG.md\
  """
urls.Repository = "https://github.com/zach-overflow/pants-plugin-depot"
entry-points."pantsbuild.plugin".rules = "maturin_pants_plugin.register:rules"
entry-points."pantsbuild.plugin".target_types = "maturin_pants_plugin.register:target_types"

[tool.setuptools]
packages.find.where = [ "src" ]
packages.find.include = [ "maturin_pants_plugin*" ]
package-data."maturin_pants_plugin.lockfile_resource" = [
  "maturin_lockfile.json",
  "maturin_lockfile.json.metadata",
]
package-data.maturin_pants_plugin = [ "py.typed" ]
# The `scm_version` target in `src/maturin_pants_plugin/BUILD` generates `version.py` from the git tags at build time;
# setuptools reads its literal statically.
dynamic.version = { attr = "maturin_pants_plugin.version.__version__" }
