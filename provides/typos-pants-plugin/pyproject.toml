[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=84.0.0" ]

[project]
name = "typos-pants-plugin"
description = "A Pantsbuild plugin for checking and fixing spelling in source code with typos."
readme = "README.md"
keywords = [
  "pants",
  "pants plugin",
  "pantsbuild",
  "spell checker",
  "spelling",
  "typos",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "zach-overflow" } ]
authors = [ { name = "Zach Gottesman" } ]
# Pants loads plugins into its own interpreter (CPython 3.14 as of Pants 2.33).
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dynamic = [ "version" ]
# `pantsbuild.pants` is deliberately absent: Pants supplies itself at plugin load time and is not on PyPI.
dependencies = [ "pants-plugin-developer-utils>=0.1.0" ]
urls."Bug Tracker" = "https://github.com/zach-overflow/pants-plugin-depot/issues"
urls.Changelog = """\
  https://github.com/zach-overflow/pants-plugin-depot/blob/main/provides/typos-pants-plugin/CHANGELOG.md\
  """
urls.Repository = "https://github.com/zach-overflow/pants-plugin-depot"

[tool.setuptools]
packages.find.where = [ "src" ]
packages.find.include = [ "typos_pants_plugin*" ]
package-data.typos_pants_plugin = [ "py.typed" ]
# The `scm_version` target in `src/typos_pants_plugin/BUILD` generates `version.py` from the git tags at build time;
# setuptools reads its literal statically.
dynamic.version = { attr = "typos_pants_plugin.version.__version__" }
