[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=84.0.0" ]

[project]
name = "pants-plugin-developer-utils"
# Rewritten by `cog bump` (see the pre-bump hook in the root `cog.toml`). Do not edit by hand.
version = "0.1.0"
description = "Collection of utilities for writing and testing pantsbuild plugins."
readme = "README.md"
keywords = [
  "pants",
  "pants plugin",
  "pantsbuild",
  "pytest",
  "pytest plugin",
  "testing",
  "type hints",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "zach-overflow" } ]
authors = [ { name = "Zach Gottesman" } ]
# Pants loads plugins into its own interpreter (CPython 3.14 as of Pants 2.33).
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
# `pantsbuild.pants` is deliberately absent: Pants supplies itself at plugin load time and is not on PyPI.
dependencies = []
# `pantsbuild.pants.testutil` 2.33 requires `pytest<9`. The extra also needs `pantsbuild.pants.testutil`
# matching the Pants version under test, which is deliberately undeclared: it pins a Pants version.
optional-dependencies.testing = [ "pytest>=8.4,<9" ]
urls."Bug Tracker" = "https://github.com/zach-overflow/pants-plugin-depot/issues"
urls.Changelog = """\
  https://github.com/zach-overflow/pants-plugin-depot/blob/main/provides/pants-plugin-developer-utils/CHANGELOG.md\
  """
urls.Repository = "https://github.com/zach-overflow/pants-plugin-depot"
entry-points.pytest11.pants_plugin_developer_utils = "pants_plugin_developer_utils.testing_utils.fixtures"

[tool.setuptools]
packages.find.where = [ "src" ]
packages.find.include = [ "pants_plugin_developer_utils*" ]
package-data.pants_plugin_developer_utils = [ "py.typed" ]
