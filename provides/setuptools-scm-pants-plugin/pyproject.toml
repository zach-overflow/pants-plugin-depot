[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=84.0.0" ]

[project]
name = "setuptools-scm-pants-plugin"
description = """\
  A Pantsbuild plugin that generates version modules from git tags with setuptools-scm, with per-package tag prefixes \
  for monorepos.\
  """
readme = "README.md"
keywords = [
  "codegen",
  "git tags",
  "monorepo",
  "pants",
  "pants plugin",
  "pantsbuild",
  "setuptools-scm",
  "versioning",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "zach-overflow" } ]
authors = [ { name = "Zach Gottesman" } ]
# Pants loads plugins into its own interpreter (CPython 3.14 as of Pants 2.33).
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Version Control :: Git",
  "Typing :: Typed",
]
dynamic = [ "version" ]
# `pantsbuild.pants` is deliberately absent: Pants supplies itself at plugin load time and is not on PyPI.
dependencies = [ "pants-plugin-developer-utils>=0.1.0" ]
urls."Bug Tracker" = "https://github.com/zach-overflow/pants-plugin-depot/issues"
urls.Changelog = """\
  https://github.com/zach-overflow/pants-plugin-depot/blob/main/provides/setuptools-scm-pants-plugin/CHANGELOG.md\
  """
urls.Repository = "https://github.com/zach-overflow/pants-plugin-depot"

[tool.setuptools]
packages.find.where = [ "src" ]
packages.find.include = [ "setuptools_scm_pants_plugin*" ]
package-data."setuptools_scm_pants_plugin.lockfile_resource" = [
  "setuptools_scm_lockfile.json",
  "setuptools_scm_lockfile.json.metadata",
]
package-data.setuptools_scm_pants_plugin = [ "py.typed" ]
# The `scm_version` target in `src/setuptools_scm_pants_plugin/BUILD` generates `version.py` from the git tags at
# build time; setuptools reads its literal statically.
dynamic.version = { attr = "setuptools_scm_pants_plugin.version.__version__" }
