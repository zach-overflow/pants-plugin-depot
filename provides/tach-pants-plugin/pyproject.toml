[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tach-pants-plugin"
dynamic = ["version"]
# Pants loads plugins into its own interpreter (CPython 3.14 as of Pants 2.33).
requires-python = ">=3.14"
# `pantsbuild.pants` is deliberately absent: Pants supplies itself at plugin load time and is not on PyPI.
dependencies = []
authors = [{ name = "Zach Gottesman" }]
maintainers = [{ name = "zach-overflow" }]
keywords = [
  "pants",
  "pants plugin",
  "pantsbuild",
  "python dependencies",
  "monorepo",
  "modular architecture",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "A Pantsbuild plugin for enforcing python import rules via `tach`."
readme = "README.md"

[project.urls]
Repository = "https://github.com/zach-overflow/pants-plugin-depot"
"Bug Tracker" = "https://github.com/zach-overflow/pants-plugin-depot/issues"
Changelog = "https://github.com/zach-overflow/pants-plugin-depot/blob/main/provides/tach-pants-plugin/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tach_pants_plugin*"]

[tool.setuptools.package-data]
tach_pants_plugin = ["py.typed"]
"tach_pants_plugin.tach_lockfile_resource" = ["tach_pants_plugin.json"]
