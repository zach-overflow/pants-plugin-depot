[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=84.0.0" ]

[project]
name = "tach-pants-plugin"
description = "A Pantsbuild plugin for enforcing python import rules via `tach`."
readme = "README.md"
keywords = [
  "modular architecture",
  "monorepo",
  "pants",
  "pants plugin",
  "pantsbuild",
  "python dependencies",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "zach-overflow" } ]
authors = [ { name = "Zach Gottesman" } ]
# Pants loads plugins into its own interpreter (CPython 3.14 as of Pants 2.33).
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dynamic = [ "version" ]
# `pantsbuild.pants` is deliberately absent: Pants supplies itself at plugin load time and is not on PyPI.
dependencies = [ "pants-plugin-developer-utils>=0.1.0" ]
urls."Bug Tracker" = "https://github.com/zach-overflow/pants-plugin-depot/issues"
urls.Changelog = "https://github.com/zach-overflow/pants-plugin-depot/blob/main/provides/tach-pants-plugin/CHANGELOG.md"
urls.Repository = "https://github.com/zach-overflow/pants-plugin-depot"

[tool.setuptools]
packages.find.where = [ "src" ]
packages.find.include = [ "tach_pants_plugin*" ]
package-data."tach_pants_plugin.tach_lockfile_resource" = [ "tach_pants_plugin.json" ]
package-data.tach_pants_plugin = [ "py.typed" ]
